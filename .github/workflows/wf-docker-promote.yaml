name: Docker Promote (temp -> target tag)

on:
  workflow_call:
    inputs:
      image:
        description: "Full image name without tag (e.g. nexus.example.com/my-app)"
        required: true
        type: string
      previous-tag-prefix:
        description: "Prefix for the previous tag (e.g. 'temp' produces temp-<sha>)"
        required: true
        type: string
      target-tag-prefix:
        description: "Prefix for the promoted tag (e.g. 'pro' produces pro-<sha>)"
        required: true
        type: string
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true
    outputs:
      sha-short:
        description: "Short Git SHA used to tag the image"
        value: ${{ jobs.promote.outputs.sha-short }}
      promoted-image-tagged:
        description: "Full promoted image with tag (image:prefix-sha)"
        value: ${{ jobs.promote.outputs.promoted-image-tagged }}

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      sha-short: ${{ steps.vars.outputs.sha_short }}
      promoted-image-tagged: ${{ steps.vars.outputs.promoted_image_tagged }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Git SHA
        id: vars
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha_short=${SHA}" >> $GITHUB_OUTPUT
          echo "promoted_image_tagged=${{ inputs.image }}:${{ inputs.target-tag-prefix }}-${SHA}" >> $GITHUB_OUTPUT

      - name: Extract Registry
        id: parse
        run: |
          # Extrae la primera parte del string antes de la barra
          REGISTRY=$(echo "${{ inputs.image }}" | cut -d'/' -f1)
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.parse.outputs.registry }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Pull previous image
        run: docker pull ${{ inputs.image }}:${{ inputs.previous-tag-prefix }}-${{ steps.vars.outputs.sha_short }}

      - name: Tag image
        run: |
          docker tag \
            ${{ inputs.image }}:${{ inputs.previous-tag-prefix }}-${{ steps.vars.outputs.sha_short }} \
            ${{ steps.vars.outputs.promoted_image_tagged }}

      - name: Push promoted image
        run: docker push ${{ steps.vars.outputs.promoted_image_tagged }}