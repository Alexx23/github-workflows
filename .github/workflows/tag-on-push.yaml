name: Auto Tag on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necesario para traer todos los tags

      - name: Get latest tag
        id: get_tag
        run: |
          git fetch --tags
          latest_tag=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: bump
        run: |
          tag=${{ steps.get_tag.outputs.latest_tag }}

          version=${tag#v}
          IFS='.' read -r major minor patch <<< "$version"

          patch=$((patch + 1))

          if [ "$patch" -gt 9 ]; then
            patch=0
            minor=$((minor + 1))
          fi

          if [ "$minor" -gt 9 ]; then
            minor=0
            major=$((major + 1))
          fi

          new_version="v$major.$minor.$patch"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Generate timestamp
        id: timestamp
        run: |
          ts=$(date +"%Y%m%d%H%M")
          echo "timestamp=$ts" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          tag="${{ steps.bump.outputs.new_version }}-${{ steps.timestamp.outputs.timestamp }}"
          git tag $tag
          git push origin $tag