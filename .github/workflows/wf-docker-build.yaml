name: Docker Build & Push (temp tag)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory that contains the Dockerfile"
        required: false
        type: string
        default: "."
      image:
        description: "Full image name without tag (e.g. nexus.example.com/my-app)"
        required: true
        type: string
      tag-prefix:
        description: "Prefix for the tag (e.g. 'temp' produces temp-<sha>)"
        required: true
        type: string
      dockerfile:
        description: "Dockerfile path. If empty, uses 'Dockerfile' inside working-directory"
        required: false
        type: string
        default: ""
      build-args:
        description: "Docker build-args in KEY=VALUE format, one per line"
        required: false
        type: string
        default: ""
      build-contexts:
        description: "Docker build-contexts in KEY=VALUE format, one per line"
        required: false
        type: string
        default: ""
      cache-image:
        description: "Image ref used for registry cache (defaults to <image>:buildcache)"
        required: false
        type: string
        default: ""
      cache-mode:
        description: "Cache mode (defaults to min)"
        required: false
        type: string
        default: "min"
      pre-build-commands:
        description: "Optional list of shell commands to run before the Docker build (one per line)"
        required: false
        type: string
        default: ""
      free-disk-space:
        description: "Free disk space before building"
        type: boolean
        default: false
      print-image-size:
        description: "Print the total size of the built image after the build"
        type: boolean
        default: true
    secrets:
      DOCKER_URL:
        description: "Custom Docker registry URL (optional, defaults to registry extracted from image name)"
        required: false
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true
    outputs:
      sha-short:
        description: "Short Git SHA used to tag the image"
        value: ${{ jobs.build.outputs.sha-short }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha-short: ${{ steps.vars.outputs.sha_short }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Free disk space (jlumbroso/free-disk-space)
        if: ${{ inputs.free-disk-space }}
        uses: jlumbroso/free-disk-space@main # última actualización: 2023
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
        
      - name: Free disk space
        if: ${{ inputs.free-disk-space }}
        working-directory: /tmp
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af --volumes
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - id: registry
        name: Detect registry
        run: |
          if [ -n "${{ secrets.DOCKER_URL }}" ]; then
            REGISTRY="${{ secrets.DOCKER_URL }}"
          else
            REGISTRY=$(echo "${{ inputs.image }}" | cut -d'/' -f1)
          fi
          echo "url=$REGISTRY" >> $GITHUB_OUTPUT

          if echo "$REGISTRY" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(:[0-9]+)?$'; then
            echo "is_ip=true" >> $GITHUB_OUTPUT
          else
            echo "is_ip=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve cache image
        id: cache
        run: |
          if [ -n "${{ inputs.cache-image }}" ]; then
            CACHE_REF="${{ inputs.cache-image }}"
          else
            IMAGE_PATH=$(echo "${{ inputs.image }}" | cut -d'/' -f2-)
            CACHE_REF="${{ steps.registry.outputs.url }}/${IMAGE_PATH}:buildcache"
          fi
          echo "ref=$CACHE_REF" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ steps.registry.outputs.url }}"]
              http = ${{ steps.registry.outputs.is_ip == 'true' }}
              insecure = ${{ steps.registry.outputs.is_ip == 'true' }}

      - name: Allow insecure Docker registry
        if: steps.registry.outputs.is_ip == 'true'
        run: |
          sudo mkdir -p /etc/docker
          echo "{\"insecure-registries\": [\"${{ steps.registry.outputs.url }}\"]}" | sudo tee -a /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.url }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Resolve image tag
        id: image
        run: |
          IMAGE_PATH=$(echo "${{ inputs.image }}" | cut -d'/' -f2-)
          echo "tag=${{ steps.registry.outputs.url }}/${IMAGE_PATH}:${{ inputs.tag-prefix }}-${{ steps.vars.outputs.sha_short }}" >> $GITHUB_OUTPUT

      - name: Resolve Dockerfile path
        id: dockerfile_path
        run: |
          if [ -z "${{ inputs.dockerfile }}" ]; then
            # Si está vacío, usamos el working-directory + Dockerfile
            echo "path=${{ inputs.working-directory }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            # Si el usuario puso algo, usamos exactamente lo que puso
            echo "path=${{ inputs.dockerfile }}" >> $GITHUB_OUTPUT
          fi

      - name: Pre-build commands
        if: ${{ inputs.pre-build-commands != '' }}
        run: ${{ inputs.pre-build-commands }}

      - name: Docker build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ steps.dockerfile_path.outputs.path }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: ${{ inputs.build-args }}
          build-contexts: ${{ inputs.build-contexts }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=${{ inputs.cache-mode }}

      - name: Print image size
        if: ${{ inputs.print-image-size }}
        working-directory: /tmp
        run: |
          SIZE_BYTES=$(docker inspect --format='{{.Size}}' "${{ steps.image.outputs.tag }}")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1073741824" | bc)
          echo "### 🐳 Docker Image Size" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.image.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${SIZE_MB} MB (${SIZE_GB} GB) |" >> $GITHUB_STEP_SUMMARY
          echo "Image size: ${SIZE_MB} MB (${SIZE_GB} GB)"